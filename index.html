<!DOCTYPE html>
<html manifest="Cache.manifest">
<head>
<meta charset="utf-8">
<title>OHAB TECH HOST</title>
<style>
/* =========================================================
   OHAB TECH HOST - Theme "Nebula" (static, no animations)
   ========================================================= */
* { box-sizing: border-box; }
html, body { height: 100%; }

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  color: #e6dcff;
  font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  background:
    radial-gradient(circle at 84% 6%, rgba(168,85,247,0.18), transparent 46%),
    radial-gradient(circle at 10% 94%, rgba(236,72,153,0.13), transparent 44%),
    linear-gradient(160deg, #0c0618 0%, #170c2c 48%, #08040f 100%);
  background-attachment: fixed;
}

/* faint static dot grid */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  background-image: radial-gradient(rgba(168,85,247,0.10) 1px, transparent 1px);
  background-size: 26px 26px;
}

/* ---------- top bar ---------- */
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 16px 24px;
  background: rgba(24,12,44,0.72);
  border-bottom: 1px solid rgba(168,85,247,0.25);
  position: relative;
  z-index: 1;
}
.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 1.1rem;
  font-weight: 800;
  letter-spacing: 3px;
  color: #f3e9ff;
}
.brand .mark {
  width: 12px;
  height: 12px;
  transform: rotate(45deg);
  background: linear-gradient(135deg, #c084fc, #f472b6);
  box-shadow: 0 0 10px rgba(192,132,252,0.7);
}
.chip {
  font-size: 0.72rem;
  letter-spacing: 2px;
  padding: 6px 14px;
  border-radius: 999px;
  color: #e9d5ff;
  white-space: nowrap;
  border: 1px solid rgba(192,132,252,0.5);
  background: rgba(147,51,234,0.2);
}

/* ---------- accent line ---------- */
.accent {
  height: 3px;
  background: linear-gradient(90deg, #a855f7, #ec4899, #f59e0b);
  position: relative;
  z-index: 1;
}

/* ---------- stage ---------- */
.stage {
  flex: 1 1 auto;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 34px 20px;
  position: relative;
  z-index: 1;
}
.panel {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 22px;
  width: 100%;
  max-width: 560px;
  padding: 40px 28px 34px;
  border-radius: 20px;
  background: linear-gradient(180deg, rgba(30,16,54,0.74), rgba(14,8,28,0.78));
  border: 1px solid rgba(168,85,247,0.28);
  box-shadow: 0 24px 60px rgba(0,0,0,0.55);
}
/* static corner brackets (retouch) */
.panel::before,
.panel::after {
  content: "";
  position: absolute;
  width: 28px;
  height: 28px;
  pointer-events: none;
}
.panel::before {
  top: 10px;
  left: 10px;
  border-top: 2px solid #c084fc;
  border-left: 2px solid #c084fc;
  border-top-left-radius: 9px;
}
.panel::after {
  bottom: 10px;
  right: 10px;
  border-bottom: 2px solid #f472b6;
  border-right: 2px solid #f472b6;
  border-bottom-right-radius: 9px;
}

/* ---------- circular progress ---------- */
.ring-wrap { position: relative; width: 210px; height: 210px; }
.ring { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring-bg { fill: none; stroke: rgba(168,85,247,0.16); stroke-width: 14; }
.ring-fg { fill: none; stroke-width: 14; stroke-linecap: round; }
.ring-label {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 2.9rem;
  font-weight: 800;
  color: #f3e9ff;
  font-variant-numeric: tabular-nums;
}
.ring-label small { font-size: 1.1rem; margin-left: 3px; color: #f9a8d4; }

/* ---------- status ---------- */
#progress {
  margin: 0;
  max-width: 100%;
  font-size: 1.25rem;
  font-weight: 600;
  line-height: 1.5;
  color: #e9d5ff;
}
#progress.ok  { color: #86efac; }
#progress.err { color: #fca5a5; }

.attempt {
  font-size: 0.74rem;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: #a98cd6;
}

/* ---------- buttons ---------- */
.btns {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  justify-content: center;
  margin-top: 2px;
}
.btn {
  padding: 11px 30px;
  font-size: 0.82rem;
  font-weight: 700;
  letter-spacing: 2px;
  text-transform: uppercase;
  cursor: pointer;
  border-radius: 10px;
  border: 1px solid rgba(192,132,252,0.55);
  background: rgba(147,51,234,0.18);
  color: #e9d5ff;
}
.btn-solid {
  border: 0;
  color: #1a0730;
  background: linear-gradient(180deg, #e9d5ff, #c084fc);
}

/* ---------- footer ---------- */
.foot {
  padding: 14px;
  text-align: center;
  font-size: 0.7rem;
  letter-spacing: 4px;
  color: #7c5aa8;
  border-top: 1px solid rgba(168,85,247,0.16);
  position: relative;
  z-index: 1;
}

@media (max-width: 480px) {
  .topbar { padding: 13px 16px; }
  .brand { font-size: 0.95rem; letter-spacing: 2px; }
  .stage { padding: 26px 16px; }
  .ring-wrap { width: 176px; height: 176px; }
  .ring-label { font-size: 2.3rem; }
  #progress { font-size: 1.05rem; }
}
</style>
<script>
/* boot: if the offline cache is not installed yet, go install it first */
if (window.applicationCache && window.applicationCache.status === 0) {
  window.location.replace("cache.html");
}
</script>
</head>
<body>

<header class="topbar">
  <span class="brand"><span class="mark"></span>OHAB TECH HOST</span>
  <span class="chip" id="fwchip">FW --</span>
</header>
<div class="accent"></div>

<main class="stage">
  <div class="panel">
    <div class="ring-wrap">
      <svg class="ring" viewBox="0 0 220 220" aria-hidden="true">
        <defs>
          <linearGradient id="ohabGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#c084fc"/>
            <stop offset="55%" stop-color="#a855f7"/>
            <stop offset="100%" stop-color="#f472b6"/>
          </linearGradient>
        </defs>
        <circle class="ring-bg" cx="110" cy="110" r="92"/>
        <circle class="ring-fg" id="ringFg" cx="110" cy="110" r="92" stroke="url(#ohabGrad)"
                stroke-dasharray="578.05" stroke-dashoffset="578.05"/>
      </svg>
      <div class="ring-label"><span id="pct">0</span><small>%</small></div>
    </div>
    <h1 id="progress">Loading GoldHEN ... Please Wait</h1>
    <div class="attempt" id="attempt"></div>
    <div class="btns">
      <button class="btn" id="refresh" type="button">Refresh</button>
      <button class="btn btn-solid" id="reset" type="button">Reset &amp; Refresh</button>
    </div>
  </div>
</main>

<footer class="foot">OHAB TECH HOST</footer>

<script>
/* =========================================================
   loader: firmware detection + exploit chain router
   ========================================================= */
var outputConsole = document.getElementById("progress");
window.log = function (msg, color) {
  if (color === undefined) color = "#cccccc";
  outputConsole.innerHTML = '<span style="color:' + color + '">' + msg + '</span><br>';
};
window.logger = function (msg, color) {
  if (color === undefined) color = "#cccccc";
  outputConsole.innerHTML = '<span style="color:' + color + '">' + msg + '</span><br>';
};
window.addEventListener('error', function (event) {
  var reason = event.error;
  var msg = 'Unhandled error\n';
  if (reason) {
    msg += reason + '\n';
    if (reason.sourceURL) msg += reason.sourceURL;
    if (reason.line) msg += ':' + reason.line;
    if (reason.column) msg += ':' + reason.column;
    if (reason.stack) msg += '\n' + reason.stack;
  } else {
    msg += 'No error object';
  }
  alert(msg);
  return true;
});

var uaFull = navigator.userAgent;
var match = uaFull.match(/PlayStation 4[ /]([\d.]+)/i);
var isPS4 = match !== null;
var fwVersion = isPS4 ? match[1] : "Unknown";
var fwNum = parseFloat(fwVersion);

function onScriptError() {
  outputConsole.innerHTML = "Content not Found! - Clear Browser Data and Re-Install Cache ...";
}

function loadScript(src) {
  var s = document.createElement('script');
  s.src = src;
  s.onerror = onScriptError;
  document.head.appendChild(s);
  return s;
}

if (!isPS4) {
  document.addEventListener("DOMContentLoaded", function () {
    outputConsole.innerHTML = "Only for PS4 with Firmware 5.05 and 6.72 and 7.00 to 14.00";
  });
} else {
  if (fwNum == 5.05 || fwNum == 5.07) {
    loadScript("exploit5.js");
  }
  else if (fwNum === 6.72) {
    outputConsole.innerHTML = "Loading GoldHEN v2.4b18.13 ...";
    var LoadedMSG = "GoldHEN v2.4b18.13 Loaded \u2714";
    var PLfile = "payload.bin";
    var s6 = loadScript("exploit6.js");
    s6.onload = function () {
      try { jailbreak672(); }
      catch (error) { window.log("Exploit error: " + error, "red"); }
    };
  }
  else if (fwNum >= 7.00 && fwNum <= 9.60) {
    loadScript("exploit7_9.js");
    setTimeout(function () {
      window.log("Reloading...");
      try { doJailBreak(); }
      catch (error) { window.log("An error occured during exploit: " + error, "red"); }
    }, 500);
  }
  else if (fwNum >= 10.00 && fwNum <= 11.02) {
    var s10 = loadScript("exploit10.js");
    s10.onload = function () { setTimeout(function () { doJb(); }, 1000); };
  }
  else if (fwNum >= 11.50 && fwNum <= 12.02) {
    loadScript("1150_1202.js");
  }
  else if (fwNum >= 12.50 && fwNum <= 13.00) {
    loadScript("1250_13.js");
  }
  else if (fwNum >= 13.02 && fwNum <= 13.52) {
    loadScript("1302_1352.js");
  }
  else if (fwNum === 14.00) {
    loadScript("1400.js");
  }
  else {
    document.addEventListener("DOMContentLoaded", function () {
      outputConsole.innerHTML = 'Unsupported Firmware: <span style="color:#fca5a5;">' + fwVersion + '</span>';
    });
  }
}
</script>

<script>
/* =========================================================
   OHAB TECH HOST - progress + safety layer
   - circular progress 0% -> 100%
   - NO automatic reload: a failed exploit must be followed by a
     console restart. Re-running it automatically can exhaust the
     browser memory or panic the kernel (console shutdown).
   ========================================================= */
(function () {
  "use strict";
  var RING_C = 2 * Math.PI * 92;

  var ringFg    = document.getElementById("ringFg");
  var pctEl     = document.getElementById("pct");
  var msgsEl    = document.getElementById("progress");
  var refreshBtn = document.getElementById("refresh");
  var resetBtn  = document.getElementById("reset");
  var attemptEl = document.getElementById("attempt");
  var fwChip    = document.getElementById("fwchip");

  /* ---- progress ring ---- */
  var progress = 0;
  function draw(p) {
    progress = Math.max(0, Math.min(100, p));
    if (ringFg) ringFg.style.strokeDashoffset = String(RING_C * (1 - progress / 100));
    if (pctEl)  pctEl.textContent = String(Math.round(progress));
  }
  window.ohabSetProgress = draw;
  draw(0);

  if (fwChip) fwChip.textContent = isPS4 ? ("FW " + fwVersion) : "NO PS4";

  /* ---- manual controls (user-triggered only) ---- */
  function reload() { try { location.reload(); } catch (e) {} }
  function resetAndReload() { try { sessionStorage.clear(); } catch (e) {} reload(); }

  if (refreshBtn) refreshBtn.onclick = function () { reload(); };
  if (resetBtn) resetBtn.onclick = function () { resetAndReload(); };

  var finished = false;

  function succeed() {
    if (finished) return;
    finished = true;
    clearInterval(estimator);
    draw(100);
    if (attemptEl) attemptEl.textContent = "DONE";
  }

  function fail(message) {
    if (finished) return;
    finished = true;
    clearInterval(estimator);
    msgsEl.className = "err";
    msgsEl.innerHTML = (message || "Failed to Load!") +
      "<br>Restart the console, then press \u201cReset &amp; Refresh\u201d.";
  }

  function stop(message) {
    if (finished) return;
    finished = true;
    clearInterval(estimator);
    msgsEl.className = "err";
    msgsEl.innerHTML = message;
  }

  function check(text) {
    if (finished) return;
    if (/No offsets for this firmware|Unsupported Firmware|Only for PS4/i.test(text)) { stop(text); return; }
    if (/Loaded/.test(text) && !/Failed/i.test(text)) { succeed(); return; }
    if (/Failed to Load|Failed to load|Error Installing|Content not Found/i.test(text)) { fail(text); }
  }

  var lastActivity = Date.now();
  function onActivity() { lastActivity = Date.now(); check(msgsEl.textContent); }

  if (window.MutationObserver) {
    new MutationObserver(onActivity)
      .observe(msgsEl, { childList: true, characterData: true, subtree: true });
  } else {
    setInterval(onActivity, 800);
  }
  check(msgsEl.textContent);

  /* ---- progress estimator (chains expose no real %) ----
     eases towards 95% while working, jumps to 100% on success */
  var startedAt = Date.now();
  var estimator = setInterval(function () {
    if (finished) { clearInterval(estimator); return; }
    var t = (Date.now() - startedAt) / 1000;
    var p = 95 * (1 - Math.exp(-t / 20));
    if (p > progress) draw(p);
  }, 300);

  /* ---- stall notice: inform only, never auto-reload ---- */
  setInterval(function () {
    if (finished) return;
    if (Date.now() - lastActivity > 90000) {
      finished = true;
      clearInterval(estimator);
      msgsEl.className = "err";
      msgsEl.innerHTML = "No response from the exploit." +
        "<br>Restart the console, then press \u201cReset &amp; Refresh\u201d.";
    }
  }, 5000);
})();
</script>
</body>
</html>
