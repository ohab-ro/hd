<!DOCTYPE html>
<html manifest="Cache.manifest">
<head>
<meta charset="utf-8">
<title>OHAB TECH HOST</title>
<style>
/* =========================================================
   OHAB TECH HOST - Theme "Nebula" (static, no animations)
   ========================================================= */
* { box-sizing: border-box; }
html, body { height: 100%; }

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  color: #e6dcff;
  font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  background:
    radial-gradient(circle at 84% 6%, rgba(168,85,247,0.18), transparent 46%),
    radial-gradient(circle at 10% 94%, rgba(236,72,153,0.13), transparent 44%),
    linear-gradient(160deg, #0c0618 0%, #170c2c 48%, #08040f 100%);
  background-attachment: fixed;
}
body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  background-image: radial-gradient(rgba(168,85,247,0.10) 1px, transparent 1px);
  background-size: 26px 26px;
}

.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 16px 24px;
  background: rgba(24,12,44,0.72);
  border-bottom: 1px solid rgba(168,85,247,0.25);
  position: relative;
  z-index: 1;
}
.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 1.1rem;
  font-weight: 800;
  letter-spacing: 3px;
  color: #f3e9ff;
}
.brand .mark {
  width: 12px;
  height: 12px;
  transform: rotate(45deg);
  background: linear-gradient(135deg, #c084fc, #f472b6);
  box-shadow: 0 0 10px rgba(192,132,252,0.7);
}
.chip {
  font-size: 0.72rem;
  letter-spacing: 2px;
  padding: 6px 14px;
  border-radius: 999px;
  color: #e9d5ff;
  white-space: nowrap;
  border: 1px solid rgba(192,132,252,0.5);
  background: rgba(147,51,234,0.2);
}
.accent {
  height: 3px;
  background: linear-gradient(90deg, #a855f7, #ec4899, #f59e0b);
  position: relative;
  z-index: 1;
}

.stage {
  flex: 1 1 auto;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 34px 20px;
  position: relative;
  z-index: 1;
}
.panel {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 22px;
  width: 100%;
  max-width: 560px;
  padding: 40px 28px 34px;
  border-radius: 20px;
  background: linear-gradient(180deg, rgba(30,16,54,0.74), rgba(14,8,28,0.78));
  border: 1px solid rgba(168,85,247,0.28);
  box-shadow: 0 24px 60px rgba(0,0,0,0.55);
}
.panel::before,
.panel::after {
  content: "";
  position: absolute;
  width: 28px;
  height: 28px;
  pointer-events: none;
}
.panel::before {
  top: 10px;
  left: 10px;
  border-top: 2px solid #c084fc;
  border-left: 2px solid #c084fc;
  border-top-left-radius: 9px;
}
.panel::after {
  bottom: 10px;
  right: 10px;
  border-bottom: 2px solid #f472b6;
  border-right: 2px solid #f472b6;
  border-bottom-right-radius: 9px;
}

.ring-wrap { position: relative; width: 210px; height: 210px; }
.ring { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring-bg { fill: none; stroke: rgba(168,85,247,0.16); stroke-width: 14; }
.ring-fg { fill: none; stroke-width: 14; stroke-linecap: round; }
.ring-label {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 2.9rem;
  font-weight: 800;
  color: #f3e9ff;
  font-variant-numeric: tabular-nums;
}
.ring-label small { font-size: 1.1rem; margin-left: 3px; color: #f9a8d4; }

#progress {
  margin: 0;
  max-width: 100%;
  font-size: 1.25rem;
  font-weight: 600;
  line-height: 1.5;
  color: #e9d5ff;
}
#progress.ok  { color: #86efac; }
#progress.err { color: #fca5a5; }

.hint {
  font-size: 0.74rem;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: #a98cd6;
}

.foot {
  padding: 14px;
  text-align: center;
  font-size: 0.7rem;
  letter-spacing: 4px;
  color: #7c5aa8;
  border-top: 1px solid rgba(168,85,247,0.16);
  position: relative;
  z-index: 1;
}

@media (max-width: 480px) {
  .topbar { padding: 13px 16px; }
  .brand { font-size: 0.95rem; letter-spacing: 2px; }
  .stage { padding: 26px 16px; }
  .ring-wrap { width: 176px; height: 176px; }
  .ring-label { font-size: 2.3rem; }
  #progress { font-size: 1.05rem; }
}
</style>
<script>
history.replaceState(null, null, 'index.html');
var histlength = history.length;
history.go(-histlength);

var RING_C = 2 * Math.PI * 92;
function ohabSetProgress(p) {
  p = Math.max(0, Math.min(100, p));
  var ring = document.getElementById("ringFg");
  var pct = document.getElementById("pct");
  if (ring) ring.style.strokeDashoffset = String(RING_C * (1 - p / 100));
  if (pct)  pct.textContent = String(Math.round(p));
}
window.ohabSetProgress = ohabSetProgress;

function DLProgress(e) {
  var Percent = Math.round(e.loaded / e.total * 100);
  ohabSetProgress(Percent);
  setTimeout(function () {
    if (window.progress) window.progress.innerHTML = "Installing Offline Cache: " + Percent + "%";
  }, 200);
}
function DisplayCacheProgress() {
  ohabSetProgress(100);
  setTimeout(function () {
    if (window.progress) { window.progress.className = "ok"; window.progress.innerHTML = "Cache Installed Successfully \u2714"; }
  }, 1500);
  setTimeout(function () {
    if (window.progress) window.progress.innerHTML = "Reopen the Page !!";
  }, 3500);
}
function CacheError() {
  if (window.progress) { window.progress.className = "err"; window.progress.innerHTML = "Cache Install Failed - Clear Browser Data and try again."; }
}
window.applicationCache.addEventListener("progress", DLProgress, false);
window.applicationCache.oncached = function () { DisplayCacheProgress(); };
window.applicationCache.onupdateready = function () { DisplayCacheProgress(); };
window.applicationCache.onerror = function () { CacheError(); };
</script>
</head>
<body>

<header class="topbar">
  <span class="brand"><span class="mark"></span>OHAB TECH HOST</span>
  <span class="chip">CACHE</span>
</header>
<div class="accent"></div>

<main class="stage">
  <div class="panel">
    <div class="ring-wrap">
      <svg class="ring" viewBox="0 0 220 220" aria-hidden="true">
        <defs>
          <linearGradient id="ohabGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#c084fc"/>
            <stop offset="55%" stop-color="#a855f7"/>
            <stop offset="100%" stop-color="#f472b6"/>
          </linearGradient>
        </defs>
        <circle class="ring-bg" cx="110" cy="110" r="92"/>
        <circle class="ring-fg" id="ringFg" cx="110" cy="110" r="92" stroke="url(#ohabGrad)"
                stroke-dasharray="578.05" stroke-dashoffset="578.05"/>
      </svg>
      <div class="ring-label"><span id="pct">0</span><small>%</small></div>
    </div>
    <h1 id="progress">Installing Offline Cache ... Please Wait</h1>
    <div class="hint">Do not close the browser</div>
  </div>
</main>

<footer class="foot">OHAB TECH HOST</footer>

</body>
</html>
